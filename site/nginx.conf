# Shared security headers — included in every location so Cache-Control
# add_header lines do not drop them (nginx inheritance quirk).
# Note: this image has no brotli module; gzip only (documented).
# PR-1: distribution locations only (no legacy/case redirects yet).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects: avoid http://host:8080/... behind Coolify/Traefik
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 256;

    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed Pagefind entry/UI — no-cache so redeploys take effect immediately
    location = /pagefind/pagefind-entry.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /pagefind/pagefind.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /pagefind/pagefind-ui.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /pagefind/pagefind-ui.css {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Hashed Pagefind index/fragments can be cached briefly
    location /pagefind/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Skill source downloads (catalog redesign) — never active content; locked-down CSP.
    location /files/ {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type text/plain;
        charset utf-8;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        # Files only — bare directories must not list or 403 silently
        try_files $uri =404;
    }

    # Discovery and index JSON
    location ~ ^/(?:\.well-known/agent-skills/index\.json|skills\.json|skill/[a-z0-9-]+\.json|skill/[a-z0-9-]+/\.well-known/agent-skills/index\.json|schemas/[a-z0-9.-]+\.json)$ {
        include /etc/nginx/snippets/dist-headers.conf;
        types { } default_type "application/json";
        charset utf-8;
        charset_types application/json;
        try_files $uri =404;
    }

    location ~ ^/(?:llms(?:-full)?\.txt|install\.md)$ {
        include /etc/nginx/snippets/dist-headers.conf;
        types { text/markdown md; }
        default_type "text/plain";
        charset utf-8;
        charset_types text/plain text/markdown;
        try_files $uri =404;
    }

    location ~ ^/(?:skill/[a-z0-9-]+|skills)\.zip$ {
        include /etc/nginx/snippets/dist-headers.conf;
        types { } default_type application/zip;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    location ~ ^/(?:skill/[a-z0-9-]+|skills)\.tar\.gz$ {
        include /etc/nginx/snippets/dist-headers.conf;
        types { } default_type application/gzip;
        add_header Content-Disposition "attachment" always;
        gzip off;
        try_files $uri =404;
    }

    # Raw skill files under /skill/<name>/… (allowlisted extensions only)
    location ~ ^/skill/[a-z0-9-]+/. {
        include /etc/nginx/snippets/dist-headers.conf;
        types {
            text/markdown md;
            text/plain    txt csv yaml yml;
            application/json json;
        }
        default_type text/plain;
        charset utf-8;
        charset_types text/markdown text/plain application/json;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
