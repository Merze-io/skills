# Shared security headers — included in every location so Cache-Control
# add_header lines do not drop them (nginx inheritance quirk).
# Note: this image has no brotli module; gzip only (documented).
# PR-2: legacy /files/ /case /strip-slash redirects + /skill/ page locations.

include /etc/nginx/snippets/skills-redirects.conf;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects: avoid http://host:8080/... behind Coolify/Traefik
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 256;

    # Order: legacy → files → case → strip slash (one hop to canonical).
    if ($legacy_redirect)     { return 301 $legacy_redirect$is_args$args; }
    if ($files_redirect)      { return 301 $files_redirect$is_args$args; }
    if ($skill_case_redirect) { return 301 $skill_case_redirect$is_args$args; }
    if ($strip_slash)         { return 301 $strip_slash$is_args$args; }

    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed Pagefind entry/UI — no-cache so redeploys take effect immediately
    location = /pagefind/pagefind-entry.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /pagefind/pagefind.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /pagefind/pagefind-ui.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /pagefind/pagefind-ui.css {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Hashed Pagefind index/fragments can be cached briefly
    location /pagefind/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Discovery and index JSON
    location ~ ^/(?:\.well-known/agent-skills/index\.json|skills\.json|skill/[a-z0-9-]+\.json|skill/[a-z0-9-]+/\.well-known/agent-skills/index\.json|schemas/[a-z0-9.-]+\.json)$ {
        include /etc/nginx/snippets/dist-headers.conf;
        types { } default_type "application/json";
        charset utf-8;
        charset_types application/json;
        try_files $uri =404;
    }

    location ~ ^/(?:llms(?:-full)?\.txt|install\.md)$ {
        include /etc/nginx/snippets/dist-headers.conf;
        types { text/markdown md; }
        default_type "text/plain";
        charset utf-8;
        charset_types text/plain text/markdown;
        try_files $uri =404;
    }

    location ~ ^/(?:skill/[a-z0-9-]+|skills)\.zip$ {
        include /etc/nginx/snippets/dist-headers.conf;
        types { } default_type application/zip;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    location ~ ^/(?:skill/[a-z0-9-]+|skills)\.tar\.gz$ {
        include /etc/nginx/snippets/dist-headers.conf;
        types { } default_type application/gzip;
        add_header Content-Disposition "attachment" always;
        gzip off;
        try_files $uri =404;
    }

    # Skill page /skill/<name> (HTML), advertising its markdown twin per llmstxt.org
    location ~ ^/skill/[a-z0-9-]+$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Link "<$uri/SKILL.md>; rel=\"alternate\"; type=\"text/markdown\", </llms.txt>; rel=\"describedby\"" always;
        try_files $uri/index.html =404;
    }

    # Raw files /skill/<name>/<path>. Extensionless paths fall through to the rendered sub-page.
    location ~ ^/skill/[a-z0-9-]+/. {
        include /etc/nginx/snippets/dist-headers.conf;
        types {
            text/markdown md markdown;
            text/plain    txt csv yaml yml;
            application/json json;
        }
        default_type text/plain;
        charset utf-8;
        charset_types text/markdown text/plain application/json;
        try_files $uri @subpage;
    }

    location @subpage {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri/index.html =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
