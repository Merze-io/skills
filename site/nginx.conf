# Shared security headers — included in every location so Cache-Control
# add_header lines do not drop them (nginx inheritance quirk).
# Note: this image has no brotli module; gzip only (documented).
# PR-2: legacy /files/ /case /strip-slash redirects + /skill/ page locations.

include /etc/nginx/snippets/skills-redirects.conf;

# MER-1104 edge rate limiting (nginx limit_req). Thresholds below are the
# reviewed defaults; adjust the rate= values here only, document in
# docs/agent/system-map.md step 5.
#   group     rate   burst  window   (nodelay)
#   raw       30r/m  20     60s      allows one normal install's file burst
#   zip       10r/m  6      60s      occasional archive download + retries
#   discovery 60r/m  30     60s      small JSON, startup polling tolerated
map $uri $discovery_key {
    ~^/skills\.json$                                              $binary_remote_addr;
    ~^/\.well-known/agent-skills/index\.json$                     $binary_remote_addr;
    ~^/skill/[a-z0-9-]+\.json$                                    $binary_remote_addr;
    ~^/skill/[a-z0-9-]+/\.well-known/agent-skills/index\.json$    $binary_remote_addr;
    default "";                                                   # empty key = not counted (schemas/*.json stay unlimited)
}
limit_req_zone $binary_remote_addr zone=rl_raw:10m       rate=30r/m;
limit_req_zone $discovery_key      zone=rl_discovery:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=rl_zip:10m       rate=10r/m;
limit_req_status 429;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects: avoid http://host:8080/... behind Coolify/Traefik
    absolute_redirect off;
    port_in_redirect off;
    # Keep encoded // and collapsed-slash probes distinct (/%2F/%2F… and //evil).
    merge_slashes off;

    # Client IP behind Coolify/Traefik (private hops only) so limit_req keys
    # on the real client, not the proxy.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/markdown application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 256;

    # Order: legacy → files → case → strip slash (one hop to canonical).
    if ($legacy_redirect)     { return 301 $legacy_redirect$is_args$args; }
    if ($files_redirect)      { return 301 $files_redirect$is_args$args; }
    if ($skill_case_redirect) { return 301 $skill_case_redirect$is_args$args; }
    if ($strip_slash)         { return 301 $strip_slash$is_args$args; }

    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed Pagefind entry/UI — no-cache so redeploys take effect immediately
    location = /pagefind/pagefind-entry.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /pagefind/pagefind.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /pagefind/pagefind-ui.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location = /pagefind/pagefind-ui.css {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Hashed Pagefind index/fragments can be cached briefly
    location /pagefind/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Discovery and index JSON
    location ~ ^/(?:\.well-known/agent-skills/index\.json|skills\.json|skill/[a-z0-9-]+\.json|skill/[a-z0-9-]+/\.well-known/agent-skills/index\.json|schemas/[a-z0-9.-]+\.json)$ {
        include /etc/nginx/snippets/dist-headers.conf;
        types { } default_type "application/json";
        charset utf-8;
        charset_types application/json;
        limit_req zone=rl_discovery burst=30 nodelay;
        try_files $uri =404;
    }

    location ~ ^/(?:llms(?:-full)?\.txt|install\.md)$ {
        include /etc/nginx/snippets/dist-headers.conf;
        types { text/markdown md; }
        default_type "text/plain";
        charset utf-8;
        charset_types text/plain text/markdown;
        try_files $uri =404;
    }

    location ~ ^/(?:skill/[a-z0-9-]+|skills)\.zip$ {
        include /etc/nginx/snippets/dist-headers.conf;
        types { } default_type application/zip;
        add_header Content-Disposition "attachment" always;
        limit_req zone=rl_zip burst=6 nodelay;
        try_files $uri =404;
    }

    location ~ ^/(?:skill/[a-z0-9-]+|skills)\.tar\.gz$ {
        include /etc/nginx/snippets/dist-headers.conf;
        types { } default_type application/gzip;
        add_header Content-Disposition "attachment" always;
        gzip off;
        try_files $uri =404;
    }

    # Skill page /skill/<name> (HTML), advertising its markdown twin per llmstxt.org
    location ~ ^/skill/[a-z0-9-]+$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header Link "<$uri/SKILL.md>; rel=\"alternate\"; type=\"text/markdown\", </llms.txt>; rel=\"describedby\"" always;
        try_files $uri/index.html =404;
    }

    # Raw files /skill/<name>/<path>. Extensionless paths fall through to the rendered sub-page.
    location ~ ^/skill/[a-z0-9-]+/. {
        include /etc/nginx/snippets/dist-headers.conf;
        types {
            text/markdown md markdown;
            text/plain    txt csv yaml yml;
            application/json json;
        }
        default_type text/plain;
        charset utf-8;
        charset_types text/markdown text/plain application/json;
        limit_req zone=rl_raw burst=20 nodelay;
        try_files $uri @subpage;
    }

    location @subpage {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri/index.html =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
