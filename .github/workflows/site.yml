name: site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Verify catalog artifacts
        working-directory: site
        run: |
          test -f dist/healthz
          test -f dist/skills.json
          test -f dist/robots.txt
          test -f dist/404.html
          test -d dist/pagefind
          test -f dist/us-llc-state-cost/index.html
          test -f dist/us-llc-state-cost/states/index.html
          grep -q 'ok' dist/healthz
          grep -q 'us-llc-state-cost' dist/skills.json
          grep -q '/us-llc-state-cost/states/' dist/us-llc-state-cost/index.html

      - name: Link check (local routes)
        working-directory: site
        run: |
          set -euo pipefail
          # Map site paths to built files and assert they exist.
          check() {
            local url="$1"
            local file
            if [[ "$url" == */ ]]; then
              file="dist${url}index.html"
            else
              file="dist${url}"
            fi
            if [[ ! -f "$file" ]]; then
              echo "Missing: $url -> $file"
              return 1
            fi
            echo "OK $url"
          }
          check /
          check /about/
          check /us-llc-state-cost/
          check /us-llc-state-cost/states/
          check /skills.json
          check /healthz
          check /404.html
          check /robots.txt
          check /favicon.png
          check /logo.avif
          # Every root-relative href in HTML that points under this site
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          dist = Path("dist")
          hrefs = set()
          for html in dist.rglob("*.html"):
              text = html.read_text(encoding="utf-8", errors="ignore")
              for m in re.finditer(r'''(?:href|src)=["'](/[^"'#?]*)''', text):
                  hrefs.add(m.group(1))
          missing = []
          for href in sorted(hrefs):
              if href.startswith("//"):
                  continue
              rel = href.lstrip("/")
              candidates = [
                  dist / rel,
                  dist / rel / "index.html",
                  dist / f"{rel}.html",
              ]
              if any(p.exists() for p in candidates):
                  continue
              # trailing-slash directory pages
              if (dist / rel.rstrip("/")).is_dir() and (dist / rel.rstrip("/") / "index.html").exists():
                  continue
              missing.append(href)
          if missing:
              print("Broken local links:")
              for m in missing:
                  print(" ", m)
              sys.exit(1)
          print(f"Checked {len(hrefs)} root-relative links; all resolve.")
          PY

      - name: Serve dist and run axe
        working-directory: site
        run: |
          npx --yes serve dist -l 4173 &
          SERVE_PID=$!
          trap 'kill $SERVE_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.5
          done
          npx --yes @axe-core/cli@4.10.1 \
            http://127.0.0.1:4173/ \
            http://127.0.0.1:4173/us-llc-state-cost/ \
            http://127.0.0.1:4173/us-llc-state-cost/states/ \
            http://127.0.0.1:4173/about/ \
            http://127.0.0.1:4173/404.html \
            --exit
