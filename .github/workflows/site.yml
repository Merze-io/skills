name: site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Verify catalog artifacts
        working-directory: site
        run: |
          test -f dist/healthz
          test -f dist/skills.json
          test -f dist/robots.txt
          test -f dist/404.html
          test -d dist/pagefind
          test -f dist/us-llc-state-cost/index.html
          test -f dist/us-llc-state-cost/states/index.html
          test -f dist/logo.png
          grep -q 'ok' dist/healthz
          grep -q 'us-llc-state-cost' dist/skills.json
          grep -q '/us-llc-state-cost/states/' dist/us-llc-state-cost/index.html
          # TOC anchors must match heading ids (no user-content- clobber)
          ! grep -q 'id="user-content-' dist/us-llc-state-cost/index.html
          grep -q 'class="heading-anchor"' dist/us-llc-state-cost/index.html
          grep -q 'id="skill-version-mandatory"' dist/us-llc-state-cost/index.html
          grep -q 'href="#skill-version-mandatory"' dist/us-llc-state-cost/index.html
          test -f dist/files/us-llc-state-cost/SKILL.md
          test -f dist/files/us-llc-state-cost/states.md

      - name: Fail if dist contains disallowed github mentions
        working-directory: site
        run: |
          # Single scanner (also runs at end of npm run build). Policy in DESIGN.md.
          node scripts/scrub-github.mjs

      - name: Skill allowlist, path rule, nested install, github gate self-test
        working-directory: site
        run: |
          set -euo pipefail

          expect_build_fail() {
            local label="$1"
            local needle="$2"
            set +e
            NO_COLOR=1 FORCE_COLOR=0 npm run build > /tmp/files-sec-build.log 2>&1
            local code=$?
            set -e
            sed -i 's/\x1b\[[0-9;]*[mK]//g' /tmp/files-sec-build.log
            if [[ $code -eq 0 ]]; then
              echo "Expected build to fail: $label"
              cat /tmp/files-sec-build.log
              exit 1
            fi
            if ! grep -F "$needle" /tmp/files-sec-build.log; then
              echo "Expected error containing: $needle"
              cat /tmp/files-sec-build.log
              exit 1
            fi
            echo "OK fail: $label"
          }

          # Disallowed extension
          BAD="../zz-files-security"
          mkdir -p "$BAD"
          cat > "$BAD/SKILL.md" <<'EOF'
          ---
          name: zz-files-security
          description: CI fixture for allowlist and symlink policy.
          ---
          # fixture
          EOF
          printf '<svg xmlns="http://www.w3.org/2000/svg"><script>alert(1)</script></svg>\n' > "$BAD/evil.svg"
          expect_build_fail "disallowed svg" "Disallowed file"
          rm -rf "$BAD"

          # Symlinks fail the build
          SYML="../zz-files-symlink-fail"
          mkdir -p "$SYML"
          cat > "$SYML/SKILL.md" <<'EOF'
          ---
          name: zz-files-symlink-fail
          description: CI fixture proving symlinks fail the build.
          ---
          # fixture
          EOF
          printf 'SECRET=nope\n' > ../site/secret.env.ci
          ln -s ../site/secret.env.ci "$SYML/notes.txt"
          expect_build_fail "symlink" "symlink not allowed"
          rm -rf "$SYML" ../site/secret.env.ci

          # Hostile names fail the build (shell metacharacters / URL punctuation)
          HOST="../zz-hostile-names"
          mkdir -p "$HOST"
          cat > "$HOST/SKILL.md" <<'EOF'
          ---
          name: zz-hostile-names
          description: CI fixture proving hostile file names fail the build.
          ---
          # fixture
          EOF
          printf 'x\n' > "$HOST"'/$(touch PWNED).txt'
          expect_build_fail 'hostile $(touch)' "path segment must match"
          rm -f "$HOST"'/$(touch PWNED).txt'
          printf 'x\n' > "$HOST/x;touch PWNED2;.txt"
          expect_build_fail "hostile semicolon" "path segment must match"
          rm -f "$HOST/x;touch PWNED2;.txt"
          printf 'x\n' > "$HOST/q#frag?.txt"
          expect_build_fail "hostile hash/query" "path segment must match"
          rm -rf "$HOST"

          # Nested install: 7 files, curl --create-dirs delivers all
          NEST="../zz-nested-install"
          rm -rf "$NEST" /tmp/zz-nested-install-out
          mkdir -p "$NEST/sub/deep"
          cat > "$NEST/SKILL.md" <<'EOF'
          ---
          name: zz-nested-install
          description: CI fixture proving nested install delivers every file.
          ---
          # fixture skill
          EOF
          printf 'states\n' > "$NEST/states.md"
          printf 'config: true\n' > "$NEST/config.yaml"
          printf 'meta\n' > "$NEST/meta.json"
          printf 'notes\n' > "$NEST/sub/notes.txt"
          printf '{"ok":true}\n' > "$NEST/sub/deep/data.json"
          printf 'a,b\n1,2\n' > "$NEST/sub/deep/table.csv"
          npm run build
          test -f dist/files/zz-nested-install/SKILL.md
          test -f dist/files/zz-nested-install/sub/notes.txt
          test -f dist/files/zz-nested-install/sub/deep/data.json
          # Parse install UI, assert SKILL.md first + --create-dirs, then replay
          # the generated curl command against a local server (7/7 files).
          python3 - <<'PY'
          from pathlib import Path
          import html as htmlmod
          import http.server
          import re
          import shutil
          import subprocess
          import threading
          from functools import partial

          page = Path("dist/zz-nested-install/index.html").read_text()
          m = re.search(r'file-list--install">(.*?)</ul>', page, re.S)
          assert m, "missing install list"
          hrefs = re.findall(r'href="(/files/zz-nested-install/[^"]+)"\s+download', m.group(1))
          names = [h.split("/files/zz-nested-install/", 1)[1] for h in hrefs]
          assert names, "no install files parsed"
          assert names[0] == "SKILL.md", names
          assert "sub/notes.txt" in names and "sub/deep/data.json" in names, names
          assert len(names) == 7, names
          assert "--create-dirs" in page
          assert "curl --create-dirs -fsSLo '" in page
          pre = re.search(r'install-snippet.*?<pre[^>]*><code>(.*?)</code></pre>', page, re.S)
          assert pre, "missing install snippet"
          cmd = htmlmod.unescape(pre.group(1))
          assert all(f"'{n}'" in cmd or f"'zz-nested-install/{n}'" in cmd for n in names)

          handler = partial(http.server.SimpleHTTPRequestHandler, directory="dist")
          server = http.server.ThreadingHTTPServer(("127.0.0.1", 8765), handler)
          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()

          out = Path("/tmp/zz-nested-install-out")
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)
          script = Path("/tmp/zz-nested-install.sh")
          script.write_text(cmd.replace("https://skills.merze.ai", "http://127.0.0.1:8765"))
          try:
              subprocess.run(["bash", str(script)], cwd=out, check=True)
          finally:
              server.shutdown()

          got = sorted(p.relative_to(out / "zz-nested-install").as_posix()
                       for p in (out / "zz-nested-install").rglob("*") if p.is_file())
          assert len(got) == 7, got
          for name in names:
              src = Path("dist/files/zz-nested-install") / name
              dst = out / "zz-nested-install" / name
              assert src.read_bytes() == dst.read_bytes(), name
          print("Nested install 7/7 OK:", got)
          PY
          rm -rf "$NEST" /tmp/zz-nested-install-out /tmp/zz-nested-install.sh

          # Github gate self-test: raw png append + gunzipped wasm injection
          npm run build
          python3 - <<'PY'
          import gzip
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          dist = Path("dist")

          def run_scrub_on_copy(mutate, label):
              with tempfile.TemporaryDirectory() as td:
                  poisoned = Path(td) / "dist"
                  shutil.copytree(dist, poisoned)
                  mutate(poisoned)
                  bak = dist.parent / "dist.bak-gate"
                  if bak.exists():
                      shutil.rmtree(bak)
                  dist.rename(bak)
                  try:
                      poisoned.rename(dist)
                      r = subprocess.run(
                          ["node", "scripts/scrub-github.mjs"],
                          capture_output=True,
                          text=True,
                      )
                  finally:
                      if dist.exists():
                          shutil.rmtree(dist)
                      bak.rename(dist)
                  if r.returncode == 0:
                      print(r.stdout)
                      print(r.stderr)
                      raise SystemExit(f"Expected gate fail: {label}")
                  print(f"OK gate fail: {label}")
                  print((r.stderr or r.stdout).strip().splitlines()[-3:])

          def inject_logo(root: Path):
              with (root / "logo.png").open("ab") as f:
                  f.write(b"github")

          def inject_wasm(root: Path):
              wasm = root / "pagefind" / "wasm.en.pagefind"
              raw = wasm.read_bytes()
              try:
                  body = gzip.decompress(raw)
              except Exception:
                  body = raw
              wasm.write_bytes(gzip.compress(body + b"\0github\0"))

          run_scrub_on_copy(inject_logo, "logo.png")
          run_scrub_on_copy(inject_wasm, "gunzipped wasm.en.pagefind")
          PY

          # Restore clean dist for later steps
          npm run build

      - name: Link check (local routes + #fragments)
        working-directory: site
        run: |
          set -euo pipefail
          check() {
            local url="$1"
            local file
            if [[ "$url" == */ ]]; then
              file="dist${url}index.html"
            else
              file="dist${url}"
            fi
            if [[ ! -f "$file" ]]; then
              echo "Missing: $url -> $file"
              return 1
            fi
            echo "OK $url"
          }
          check /
          check /about/
          check /us-llc-state-cost/
          check /us-llc-state-cost/states/
          check /skills.json
          check /healthz
          check /404.html
          check /robots.txt
          check /favicon.png
          check /logo.png
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          dist = Path("dist")
          hrefs = set()
          fragments = []  # (html_path, page_url_path, fragment)
          for html in dist.rglob("*.html"):
              text = html.read_text(encoding="utf-8", errors="ignore")
              rel = html.relative_to(dist).as_posix()
              page = "/" + rel.replace("index.html", "")
              for m in re.finditer(r'''(?:href|src)=["']([^"'#?]*)(#[^"']+)?["']''', text):
                  path, frag = m.group(1), m.group(2)
                  if path.startswith("http") or path.startswith("mailto:") or path.startswith("//"):
                      continue
                  if path.startswith("/"):
                      hrefs.add(path)
                  if frag and (not path or path.startswith("/") or path == ""):
                      # in-page or root-relative with fragment
                      target_page = page if not path else path
                      fragments.append((rel, target_page, frag[1:]))

          missing = []
          for href in sorted(hrefs):
              if href.startswith("//"):
                  continue
              r = href.lstrip("/")
              candidates = [dist / r, dist / r / "index.html", dist / f"{r}.html"]
              if any(p.exists() for p in candidates):
                  continue
              if (dist / r.rstrip("/")).is_dir() and (dist / r.rstrip("/") / "index.html").exists():
                  continue
              missing.append(href)

          frag_missing = []
          for rel, target_page, frag_id in fragments:
              if target_page.endswith("/"):
                  target_file = dist / target_page.lstrip("/") / "index.html"
              elif target_page.endswith(".html"):
                  target_file = dist / target_page.lstrip("/")
              else:
                  target_file = dist / target_page.lstrip("/") / "index.html"
                  if not target_file.exists():
                      target_file = dist / (target_page.lstrip("/") + ".html")
              if not target_file.exists():
                  # skip external-ish
                  continue
              html = target_file.read_text(encoding="utf-8", errors="ignore")
              if f'id="{frag_id}"' not in html and f"id='{frag_id}'" not in html:
                  frag_missing.append(f"{rel} -> {target_page}#{frag_id}")

          if missing or frag_missing:
              if missing:
                  print("Broken local links:")
                  for m in missing:
                      print(" ", m)
              if frag_missing:
                  print("Broken #fragments:")
                  for m in frag_missing:
                      print(" ", m)
              sys.exit(1)
          print(f"Checked {len(hrefs)} paths and {len(fragments)} fragments; all resolve.")
          PY

      - name: Bad frontmatter fixture fails build
        working-directory: site
        run: |
          set -euo pipefail
          FIX="../_ci-bad-skill-fixture"
          mkdir -p "$FIX"
          cat > "$FIX/SKILL.md" <<'EOF'
          ---
          name: not-matching-folder
          description: ""
          ---
          # bad
          EOF
          # Underscore folders must be ignored — this must NOT fail the good build path.
          # Use a non-underscore temp skill that should fail:
          BAD="../zz-bad-frontmatter"
          mkdir -p "$BAD"
          cat > "$BAD/SKILL.md" <<'EOF'
          ---
          name: zz-bad-frontmatter
          description: ""
          ---
          # bad
          EOF
          set +e
          # NO_COLOR so Astro/Zod ANSI codes don't split the exact error strings
          NO_COLOR=1 FORCE_COLOR=0 npm run build > /tmp/bad-fm-build.log 2>&1
          code=$?
          set -e
          rm -rf "$FIX" "$BAD"
          # Strip any residual ANSI (CI may still force color)
          sed -i 's/\x1b\[[0-9;]*[mK]//g' /tmp/bad-fm-build.log
          if [[ $code -eq 0 ]]; then
            echo "Expected build to fail for empty description"
            cat /tmp/bad-fm-build.log
            exit 1
          fi
          # Exact path + Zod empty-description message so a vague failure can't pass
          if ! grep -F 'zz-bad-frontmatter/SKILL.md' /tmp/bad-fm-build.log; then
            echo "Expected error Location to include zz-bad-frontmatter/SKILL.md"
            cat /tmp/bad-fm-build.log
            exit 1
          fi
          if ! grep -F 'description: String must contain at least 1 character' /tmp/bad-fm-build.log; then
            echo "Expected exact Zod empty-description error"
            cat /tmp/bad-fm-build.log
            exit 1
          fi
          echo "Bad frontmatter correctly failed the build"
          # Restore a clean dist for later steps
          npm run build

      - name: Underscore draft folders are ignored
        working-directory: site
        run: |
          set -euo pipefail
          DRAFT="../_drafts"
          mkdir -p "$DRAFT"
          cat > "$DRAFT/SKILL.md" <<'EOF'
          ---
          name: totally-invalid!!!
          description: ""
          ---
          # should be ignored
          EOF
          npm run build
          test ! -d dist/_drafts
          rm -rf "$DRAFT"
          echo "_drafts ignored OK"

      - name: Axe at real viewports (320 / 360 / 1280)
        working-directory: site
        run: |
          npx puppeteer browsers install chrome
          # Prove overflow assertion can fail, then run the real suite
          npm run axe:viewports -- --self-test
          npm run axe:viewports

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Docker build and smoke
        run: |
          set -euo pipefail
          docker build -f site/Dockerfile -t skills-merze-ai:ci .
          cid=$(docker run -d -p 18080:8080 skills-merze-ai:ci)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/healthz | grep -q ok; then break; fi
            sleep 0.5
          done
          curl -sf http://127.0.0.1:18080/healthz | grep -q ok
          # 404 status + branded page
          code=$(curl -s -o /tmp/404.html -w '%{http_code}' http://127.0.0.1:18080/no-such-page)
          test "$code" = "404"
          grep -qi 'not found' /tmp/404.html
          # Security headers present on HTML and assets
          curl -sI http://127.0.0.1:18080/ | grep -qi 'content-security-policy'
          curl -sI http://127.0.0.1:18080/ | grep -qi 'x-content-type-options: nosniff'
          curl -sI http://127.0.0.1:18080/ | grep -qi 'wasm-unsafe-eval'
          # Real hashed _astro asset: 200 + CSP + immutable Cache-Control
          asset=$(docker exec "$cid" sh -c 'ls /usr/share/nginx/html/_astro | head -1')
          test -n "$asset"
          asset_headers=$(curl -sI "http://127.0.0.1:18080/_astro/$asset")
          echo "$asset_headers" | head -1 | grep -q '200'
          echo "$asset_headers" | grep -qi 'content-security-policy'
          echo "$asset_headers" | grep -qi 'wasm-unsafe-eval'
          echo "$asset_headers" | grep -qi 'immutable'
          # Slashless redirect must stay relative (no :8080 host port)
          loc=$(curl -sI http://127.0.0.1:18080/us-llc-state-cost | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2}')
          echo "Location: $loc"
          echo "$loc" | grep -qv ':8080'
          echo "$loc" | grep -q 'us-llc-state-cost/'
          # /files/ locked-down headers + plaintext markdown
          files_headers=$(curl -sI http://127.0.0.1:18080/files/us-llc-state-cost/SKILL.md)
          echo "$files_headers" | head -1 | grep -q '200'
          echo "$files_headers" | grep -qi 'content-type: text/plain'
          echo "$files_headers" | grep -qi 'charset=utf-8'
          echo "$files_headers" | grep -qi 'x-content-type-options: nosniff'
          echo "$files_headers" | grep -qi "content-security-policy:.*default-src 'none'"
          echo "$files_headers" | grep -qi 'sandbox'
          # Directory URL under /files/ must 404 (no listing / bare 403)
          files_dir_code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/files/us-llc-state-cost/)
          test "$files_dir_code" = "404"
          # Supporting file also served
          curl -sf http://127.0.0.1:18080/files/us-llc-state-cost/states.md | head -1 | grep -q .
          echo "Docker smoke OK"
